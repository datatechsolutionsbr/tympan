name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Guards (no Tailwind, logical CSS, provenance markers)
        run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
