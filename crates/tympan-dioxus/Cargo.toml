[package]
name = "tympan-dioxus"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Dioxus 0.7 bindings of Tympan's custom elements, generated from the same definitions as the React wrappers: typed props and events, the same light-DOM anatomy, one shared stylesheet."
repository = "https://github.com/datatechsolutionsbr/tympan"

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks", "mounted", "document"] }
tympan-tokens = { path = "../tympan-tokens" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Element", "Event", "EventTarget", "CustomEvent"] }

[dev-dependencies]
dioxus-ssr = "0.7"
scraper = "0.20"
