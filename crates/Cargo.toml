# Rust crates of the Tympan design system (FSL-1.1-ALv2).
#
# - tympan-tokens: the themes as Rust types and the built stylesheets and
#   custom-element bundle, embedded, for a host to serve.
# - tympan-dioxus: generated Dioxus bindings of Tympan's custom elements.
#
# Their generated inputs come from the JavaScript build; see
# docs/design/single-source-components.md.
[workspace]
resolver = "2"
members = ["tympan-tokens", "tympan-dioxus"]
